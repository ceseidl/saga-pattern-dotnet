name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/SagaDemo --nologo

      - name: Smoke test (happy path, compensation, idempotent inbox)
        run: |
          out=$(dotnet run --project src/SagaDemo --no-build)
          echo "$out"
          echo "$out" | grep -F 'Fluxo feliz -> Completed'
          echo "$out" | grep -F 'Fluxo de falha -> Compensated'
          echo "$out" | grep -F 'segunda entrega ignorada = True'
